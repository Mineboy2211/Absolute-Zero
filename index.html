<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Absolute Zero</title>
  <meta name="description" content="An incremental game about heating up forever, starting from 0 K.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="css/style.css?v=7">
</head>
<body>
  <header id="top">
   <div id="top-row">
    <button id="menu-toggle" aria-label="Toggle menu">☰</button>
    <div id="temp-wrap">
      <div id="temp">0.00 K</div>
      <div id="gain">+0.00 K/s</div>
    </div>
    <div id="gauge" title="Progress toward your next goal, on a logarithmic scale">
      <div id="gauge-label">&nbsp;</div>
      <div id="gauge-track"><div id="gauge-fill"></div></div>
    </div>
    <div id="currencies"></div>
   </div>
   <div id="chal-banner" hidden></div>
  </header>
  <div id="layout">
    <nav id="sidebar"></nav>
    <main id="content"></main>
  </div>
  <div id="modal-root"></div>
  <div id="toasts"></div>

  <script src="https://cdn.jsdelivr.net/npm/break_eternity.js@2.1.3/dist/break_eternity.min.js"></script>
  <script src="js/format.js?v=7"></script>
  <script src="js/state.js?v=7"></script>
  <script src="js/core.js?v=7"></script>
  <script src="js/ranks.js?v=7"></script>
  <script src="js/layers/layer.js?v=7"></script>
  <script src="js/layers/ignition.js?v=7"></script>
  <script src="js/layers/meltdown.js?v=7"></script>
  <script src="js/layers/vaporize.js?v=7"></script>
  <script src="js/layers/ionize.js?v=7"></script>
  <script src="js/layers/fusion.js?v=7"></script>
  <script src="js/challenges.js?v=7"></script>
  <script src="js/achievements.js?v=7"></script>
  <script src="js/chapters.js?v=7"></script>
  <script src="js/game.js?v=7"></script>
  <script src="js/news.js?v=7"></script>
  <script src="js/save.js?v=7"></script>
  <script src="js/ui.js?v=7"></script>
  <script src="js/main.js?v=7"></script>
</body>
</html>
